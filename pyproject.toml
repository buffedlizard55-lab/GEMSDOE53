[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gems52"
version = "2.0.0"
description = "GEMSDOE52 signed-normal structural contrast, spatial validation and gated two-view experiments"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
